name: Python package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e "./python[dev]"
      - run: python -m ruff check python
      - run: python -m ruff format --check python
      - run: python -m pytest python/tests -q
      - run: python -m splitlens --version
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build python
      - run: python -m twine check python/dist/*
      - run: python -m pip install python/dist/*.whl
      - run: python -m splitlens --version
      - uses: actions/upload-artifact@v4
        with:
          name: splitlens-python-distributions
          path: python/dist/*
          retention-days: 30
