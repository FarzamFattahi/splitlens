name: Real dataset reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/examples/beans-requirements.txt
      - run: python -m pip install -r python/examples/beans-requirements.txt
      - run: python python/examples/beans_case_study.py --workdir .datasets/beans --controls
      - run: python python/examples/render_beans_case_study.py --workdir .datasets/beans --output beans-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: beans-real-data-evidence
          path: beans-evidence/
          if-no-files-found: error
          retention-days: 30
