name: Bug report
description: Report a reproducible issue in SplitLens
body:
  - type: dropdown
    id: interface
    attributes:
      label: Which interface are you using?
      options:
        - Browser workspace
        - Python library
        - Command line
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and version
      description: Include your operating system, SplitLens version, and browser or Python version.
      placeholder: Windows 11, Python 3.12, SplitLens 1.1.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
      description: Include a small synthetic reproduction. Do not attach private datasets or credentials.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
