[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitlens"
version = "1.1.0"
description = "Private image dataset auditing, split leakage review, and verified dataset exports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Farzam Fattahi"}]
keywords = ["computer-vision", "dataset-quality", "image-deduplication", "data-leakage"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.26,<3", "Pillow>=11.3,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2", "twine>=6,<8"]

[project.scripts]
splitlens = "splitlens.cli:main"

[project.urls]
Homepage = "https://github.com/FarzamFattahi/splitlens"
Documentation = "https://github.com/FarzamFattahi/splitlens/tree/main/python"
Issues = "https://github.com/FarzamFattahi/splitlens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splitlens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
